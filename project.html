<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Anaru's Workshop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="project-detail-page">

    <div class="background-wrapper">
        <div class="container">
            <!-- Navigation -->
            <nav class="project-nav">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Workshop</a>
            </nav>

            <header class="project-header">
                <h1 id="project-title">Loading Project...</h1>
                <p class="subtitle" id="project-description"></p>
                <div class="progress-bar" id="project-progress-bar" style="display:none;"><div class="progress-fill"></div></div>
                <div class="skill-tags" id="project-tags">
                    <!-- Tags populated dynamically -->
                </div>
            </header>

            <section class="project-content fade-in">
                <h2>Project Logs</h2>
                <div id="project-log-container" class="log-grid">
                    <p>Loading project logs...</p>
                </div>
            </section>

            <section class="project-media fade-in">
                <h2>Media Gallery</h2>
                <div id="project-media-gallery" class="media-gallery">
                     <!-- Media populated dynamically -->
                     <p>Loading media...</p>
                </div>
            </section>

            <footer id="footer-section">
                <p>&copy; <span id="current-year"></span> Anaru's Workshop. <span id="system-status">Testing systems...</span></p>
            </footer>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <!-- Your Custom Script -->
    <script src="script.js" defer></script>
</body>
</html>
