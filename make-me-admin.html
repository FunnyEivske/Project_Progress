<!DOCTYPE html>
<html>
<head>
    <title>Make Me Admin</title>
</head>
<body style="font-family: sans-serif; padding: 2rem;">
    <h1>Promote Existing Account to Admin</h1>
    <p>Because your account was created before the new roles system, it doesn't have a profile in the database yet. Log in here, and this script will automatically create your profile and set you as an Admin.</p>
    
    <div id="login-section">
        <input type="email" id="email" placeholder="Your Email" style="padding: 0.5rem; margin-bottom: 0.5rem;"><br>
        <input type="password" id="password" placeholder="Password" style="padding: 0.5rem; margin-bottom: 0.5rem;"><br>
        <button onclick="makeAdmin()" style="padding: 0.5rem 1rem;">Make Me Admin</button>
    </div>

    <div id="status" style="margin-top: 1rem; font-weight: bold;"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQuF0P7leiyn3ddC1OfsElFyF6F9sZJzw",
            authDomain: "panel-aurora.firebaseapp.com",
            projectId: "panel-aurora",
            storageBucket: "panel-aurora.appspot.com",
            messagingSenderId: "479594137457",
            appId: "1:479594137457:web:f3bae0817900e3126218d0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        async function makeAdmin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('status');

            if (!email || !password) {
                statusEl.innerText = "Please enter email and password.";
                return;
            }

            statusEl.innerText = "Logging in...";
            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                document.getElementById('login-section').style.display = 'none';
                
                statusEl.innerText = "Logged in successfully. Setting up Admin profile...";
                
                // Set the document in the 'users' collection
                await db.collection('users').doc(cred.user.uid).set({
                    email: cred.user.email,
                    role: 'admin'
                });

                statusEl.innerText = "Success! You are now an Admin. You can go to admin.html and delete this file.";
            } catch (error) {
                console.error(error);
                statusEl.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
