<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Anaru's Workshop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="background-wrapper">
        <div class="container" style="max-width: 500px; padding-top: 100px;">
            <header>
                <h1>Authentication</h1>
                <p class="subtitle">Sign in or create an account</p>
            </header>

            <div class="glass-panel form-section" id="auth-forms">
                <div id="login-form-container">
                    <h2>Login</h2>
                    <form id="user-login-form">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                        <button type="submit" class="primary-btn">Login</button>
                    </form>
                    <p style="margin-top: 1rem; text-align: center;">Don't have an account? <a href="#" id="show-register">Register here</a></p>
                </div>

                <div id="register-form-container" style="display: none;">
                    <h2>Register</h2>
                    <form id="user-register-form">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required>
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" required minlength="6">
                        <button type="submit" class="primary-btn">Create Account</button>
                    </form>
                    <p style="margin-top: 1rem; text-align: center;">Already have an account? <a href="#" id="show-login">Login here</a></p>
                </div>

                <div id="logged-in-container" style="display: none;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <img id="settings-avatar-preview" src="Media/Images/default-avatar.png" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-tech); margin-bottom: 1rem;">
                        <h2>Welcome, <span id="current-user-email"></span>!</h2>
                        <p style="color: var(--text-muted-color);">Manage your account settings below.</p>
                    </div>

                    <form id="account-settings-form">
                        <label for="settings-display-name">Display Name</label>
                        <input type="text" id="settings-display-name" placeholder="Your name...">

                        <label for="settings-photo">Profile Picture</label>
                        <input type="file" id="settings-photo" accept="image/*">
                        
                        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; margin-bottom: 1.5rem; background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 12px;">
                            <input type="checkbox" id="settings-custom-bg" style="width: auto; margin: 0;">
                            <div>
                                <label for="settings-custom-bg" style="margin: 0; font-weight: bold;">Use Dynamic Backgrounds</label>
                                <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted-color);">Show project images as the website background.</p>
                            </div>
                        </div>

                        <button type="submit" class="primary-btn" style="width: 100%;"><i class="fas fa-save"></i> Save Settings</button>
                    </form>

                    <hr style="margin: 2rem 0; opacity: 0.2;">

                    <div style="display: flex; gap: 10px; justify-content: center;">
                        <a href="index.html" class="primary-btn" style="text-decoration: none; flex: 1; text-align: center;"><i class="fas fa-home"></i> Home</a>
                        <button id="user-logout-btn" class="secondary-btn" style="flex: 1;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            </div>
            
            <nav class="project-nav" style="margin-top: 20px; justify-content: center;">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Workshop</a>
            </nav>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <script src="script.js" defer></script>
</body>
</html>
